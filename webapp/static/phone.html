<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>BlindSpot</title>
<style>
  :root {
    --bg:#0b0d12; --panel:#14161d; --panel2:#171a22; --line:#232733; --line2:#2c313d;
    --text:#e7e9ee; --muted:#8b93a7; --faint:#5b6478;
    --accent:#7c5cff; --green:#34d399; --amber:#fbbf24; --red:#f87171; --blue:#60a5fa; --violet:#c084fc;
    --mono: ui-monospace, "SF Mono", Menlo, monospace;
    --sans: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { margin:0; height:100%; background:var(--bg); color:var(--text);
    font-family:var(--sans); overflow:hidden; }
  #video { position:fixed; inset:0; width:100%; height:100%; object-fit:cover;
    opacity:0.28; filter:saturate(0.9); }
  .scrim { position:fixed; inset:0;
    background:radial-gradient(120% 80% at 50% 0%, transparent 40%, var(--bg) 100%); }
  .wrap { position:fixed; inset:0; display:flex; flex-direction:column;
    justify-content:space-between; padding:22px 20px calc(22px + env(safe-area-inset-bottom)); }

  header { display:flex; align-items:center; justify-content:space-between; }
  .brand { display:flex; align-items:center; }
  .brand .name { font-weight:700; font-size:18px; letter-spacing:-0.4px; color:var(--text); }
  .brand .accentword { color:var(--accent); }
  .conn { display:flex; align-items:center; gap:7px; font-family:var(--mono);
    font-size:11px; color:var(--muted); border:1px solid var(--line);
    padding:5px 10px; border-radius:7px; }
  .conn .dot { width:6px; height:6px; border-radius:50%; background:var(--faint); }
  .conn.live { color:var(--green); border-color:#1e3a2f; }
  .conn.live .dot { background:var(--green); box-shadow:0 0 7px var(--green); }

  /* center status */
  .status { align-self:center; text-align:center; width:100%; }
  .tier { font-family:var(--mono); font-size:11px; letter-spacing:2px;
    text-transform:uppercase; color:var(--faint); margin-bottom:12px; }
  .t-silent{color:var(--faint)} .t-narrate{color:var(--green)}
  .t-proactive{color:var(--violet)} .t-question{color:var(--blue)}
  .t-danger{color:var(--red)} .t-obstructed{color:var(--amber)} .t-idle{color:var(--faint)}
  .msg { font-size:21px; line-height:1.45; text-wrap:pretty;
    background:rgba(20,22,29,0.6); border:1px solid var(--line);
    border-radius:16px; padding:20px 18px; backdrop-filter:blur(10px);
    min-height:96px; display:flex; align-items:center; justify-content:center; }

  /* controls */
  .controls { display:flex; flex-direction:column; gap:11px; }
  button { border:none; border-radius:14px; padding:17px; font-size:16px;
    font-weight:600; font-family:var(--sans); color:#fff; letter-spacing:0.2px; }
  #startBtn { background:var(--accent); box-shadow:0 8px 24px -10px var(--accent); }
  #talkBtn { background:var(--panel); color:var(--text);
    border:1px solid var(--line2); display:flex; align-items:center;
    justify-content:center; gap:9px; }
  #talkBtn:active { background:var(--panel2); }
  #talkBtn.listening { background:#2a1420; border-color:var(--red); color:#fff;
    animation:pulse 1.1s infinite; }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.62} }
  .hint { text-align:center; font-family:var(--mono); font-size:11px;
    color:var(--faint); margin-top:2px; }
  .hint b { color:var(--muted); font-weight:600; }
</style>
</head>
<body>
  <video id="video" autoplay playsinline muted></video>
  <div class="scrim"></div>

  <div class="wrap">
    <header>
      <div class="brand"><span class="name">Blind<span class="accentword">Spot</span></span></div>
      <div class="conn" id="conn"><span class="dot"></span><span id="connText">idle</span></div>
    </header>

    <div class="status">
      <div class="tier t-idle" id="tier">ready</div>
      <div class="msg" id="msg">Tap Start, then say “Hey BlindSpot”.</div>
    </div>

    <div class="controls">
      <button id="startBtn">Start BlindSpot</button>
      <button id="talkBtn">🎤 Tap to ask</button>
      <div class="hint">wake word <b>“Hey BlindSpot”</b> · or tap the mic</div>
    </div>
  </div>

<script>
const SERVER = location.origin;
const WAKE_WORDS = ["hey blindspot","blindspot","hey blind spot","blind spot"];
const FRAME_EVERY_MS = 300, JPEG_QUALITY = 0.6;

const video=document.getElementById('video'), startBtn=document.getElementById('startBtn'),
      talkBtn=document.getElementById('talkBtn'), msg=document.getElementById('msg'),
      tierEl=document.getElementById('tier'), connDot=document.getElementById('conn'),
      connText=document.getElementById('connText');

let streaming=false, pendingQuestion="", recog=null, wakeActive=false;
const canvas=document.createElement('canvas'), ctx=canvas.getContext('2d');

function speak(text){ if(!text) return;
  try{ const u=new SpeechSynthesisUtterance(text); u.rate=1.02;
    speechSynthesis.cancel(); speechSynthesis.speak(u);}catch(e){} }

async function startCamera(){
  const stream=await navigator.mediaDevices.getUserMedia({
    video:{facingMode:{ideal:"environment"},width:640,height:480}, audio:false});
  video.srcObject=stream; await video.play();
  canvas.width=640; canvas.height=480;
}
function grabFrame(){ ctx.drawImage(video,0,0,canvas.width,canvas.height);
  return canvas.toDataURL('image/jpeg',JPEG_QUALITY); }

function setTier(t){ tierEl.textContent=(t||"idle"); tierEl.className="tier t-"+(t||"idle"); }

async function tick(){
  if(!streaming) return;
  let body={image:grabFrame()};
  if(pendingQuestion){ body.question=pendingQuestion; pendingQuestion=""; }
  try{
    const data=await (await fetch(SERVER+"/frame",{method:"POST",
      headers:{"Content-Type":"application/json"},body:JSON.stringify(body)})).json();
    connDot.className="conn live"; connText.textContent="live";
    setTier(data.tier);
    if(data.speak && data.speak.length){
      msg.textContent=data.speak[data.speak.length-1];
      data.speak.forEach(speak);
    }
  }catch(e){ connDot.className="conn"; connText.textContent="reconnecting"; }
  setTimeout(tick,FRAME_EVERY_MS);
}

function setupWakeWord(){
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SR){ msg.textContent="Wake word unavailable — use the mic button."; return; }
  recog=new SR(); recog.continuous=true; recog.interimResults=false; recog.lang="en-US";
  recog.onresult=(ev)=>{
    const said=ev.results[ev.results.length-1][0].transcript.trim().toLowerCase();
    const hit=WAKE_WORDS.some(w=>said.includes(w));
    if(wakeActive){ pendingQuestion=said; msg.textContent="“"+said+"”";
      talkBtn.classList.remove('listening'); wakeActive=false; }
    else if(hit){ let rest=said; WAKE_WORDS.forEach(w=>rest=rest.replace(w,"")); rest=rest.trim();
      if(rest.length>2){ pendingQuestion=rest; msg.textContent="“"+rest+"”"; }
      else{ wakeActive=true; talkBtn.classList.add('listening');
        msg.textContent="Listening… ask your question."; speak("Yes?"); } }
  };
  recog.onend=()=>{ if(streaming){ try{recog.start();}catch(e){} } };
  try{ recog.start(); }catch(e){}
}

talkBtn.addEventListener('click',()=>{
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SR){ msg.textContent="Speech not supported on this browser."; return; }
  const one=new SR(); one.lang="en-US"; one.interimResults=false;
  talkBtn.classList.add('listening'); msg.textContent="Listening… ask your question.";
  one.onresult=(ev)=>{ const q=ev.results[0][0].transcript.trim();
    pendingQuestion=q; msg.textContent="“"+q+"”"; };
  one.onerror=()=>{ msg.textContent="Didn't catch that — try again."; };
  one.onend=()=>talkBtn.classList.remove('listening');
  one.start();
});

startBtn.addEventListener('click',async()=>{
  try{
    await startCamera(); streaming=true; startBtn.style.display="none";
    msg.textContent="Running. Say “Hey BlindSpot” or tap the mic.";
    speak("BlindSpot is ready."); setupWakeWord(); tick();
  }catch(e){ msg.textContent="Camera & mic permission needed to start."; }
});
</script>
</body>
</html>
